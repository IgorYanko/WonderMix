name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Precisa poder pushar o bump do cask de volta na main.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Package app
        run: |
          chmod +x scripts/package.sh scripts/bump-cask.sh
          ./scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WonderMix-macOS
          path: dist/WonderMix-macOS.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(cat <<EOF
          ## WonderMix ${VERSION}

          ### Homebrew (recomendado)
          \`\`\`bash
          brew tap IgorYanko/wondermix https://github.com/IgorYanko/WonderMix
          brew install --cask wondermix
          \`\`\`

          Atualizar: \`brew upgrade --cask wondermix\`

          ### curl
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/IgorYanko/WonderMix/main/scripts/install.sh | bash
          \`\`\`

          ### Após instalar
          1. Abra o app (ícone na barra de menu).
          2. Conceda **Gravação de Tela e Áudio do Sistema**.
          3. Se o macOS bloquear na 1ª abertura: botão direito → Abrir.

          > Build ad-hoc (sem notarização Apple).
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WonderMix-macOS.zip --clobber
          else
            gh release create "$TAG" dist/WonderMix-macOS.zip \
              --title "WonderMix ${VERSION}" \
              --notes "$NOTES"
          fi

      - name: Bump Homebrew cask on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ./scripts/bump-cask.sh "$VERSION" dist/WonderMix-macOS.zip

          if git diff --quiet -- Casks/wondermix.rb; then
            echo "Cask já estava atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          ./scripts/bump-cask.sh "$VERSION" dist/WonderMix-macOS.zip
          git add Casks/wondermix.rb
          git commit -m "chore: bump Homebrew cask to ${VERSION}"
          git push origin main
